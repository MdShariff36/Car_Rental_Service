<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Auto Prime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/pages/forgot-password.css" />
  </head>
  <body>
    <div class="reset-wrapper">
      <!-- Animated Background -->
      <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
      </div>

      <!-- Reset Container -->
      <div class="reset-container">
        <!-- Icon -->
        <div class="icon-wrapper">
          <div class="reset-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 6v6l4 2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="2" fill="currentColor" />
            </svg>
          </div>
        </div>

        <!-- Header -->
        <div class="reset-header">
          <h1>Forgot Password?</h1>
          <p>
            No worries! Enter your email address and we'll send you a link to
            reset your password.
          </p>
        </div>

        <!-- Form Container -->
        <div id="emailForm" class="form-section">
          <form id="resetForm">
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  id="email"
                  class="form-input"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
                <span class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                      d="M2.5 6.66667L10 11.6667L17.5 6.66667M3.33333 15H16.6667C17.5871 15 18.3333 14.2538 18.3333 13.3333V6.66667C18.3333 5.74619 17.5871 5 16.6667 5H3.33333C2.41286 5 1.66667 5.74619 1.66667 6.66667V13.3333C1.66667 14.2538 2.41286 15 3.33333 15Z"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
              </div>
            </div>

            <button type="submit" class="submit-btn">
              <span class="btn-text">Send Reset Link</span>
              <span class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M18.3333 1.66667L9.16667 10.8333M18.3333 1.66667L12.5 18.3333L9.16667 10.8333M18.3333 1.66667L1.66667 7.5L9.16667 10.8333"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>
          </form>

          <div class="back-to-login">
            <a href="login.html">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                  d="M10 13L5 8L10 3"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Back to Login
            </a>
          </div>
        </div>

        <!-- Success Message (Hidden by default) -->
        <div id="successMessage" class="success-section" style="display: none">
          <div class="success-icon">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="30" fill="#D1FAE5" />
              <path
                d="M20 32L28 40L44 24"
                stroke="#10B981"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h2>Check Your Email</h2>
          <p>
            We've sent a password reset link to <strong id="sentEmail"></strong>
          </p>
          <p class="hint">
            Didn't receive the email? Check your spam folder or
            <a href="#" id="resendLink">resend the link</a>.
          </p>

          <div class="success-actions">
            <a href="login.html" class="action-btn primary"> Back to Login </a>
            <button type="button" class="action-btn secondary" id="tryAgainBtn">
              Try Another Email
            </button>
          </div>
        </div>

        <!-- Additional Help -->
        <div class="help-section">
          <p>Need more help? <a href="contact.html">Contact Support</a></p>
        </div>
      </div>
    </div>

    <script src="assets/js/auth/forgot-password.js"></script>
  </body>
</html>
